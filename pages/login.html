<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Gestión - TECHCORE</title>
</head>
<body>
  <header class="header">
    <header class="header">
    <a href="#" class="back-link">
      <span>&larr;</span> Volver al sitio principal
    </a>
  </header>

  <main class="main-container">
    <section class="login-card">
      <span class="badge-restricted">ACCESO RESTRINGIDO</span>
      <h1 class="card-title">Portal de Gestión</h1>

      <form action="#" method="POST" class="login-form">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <div class="input-container">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input 
              type="email" 
              id="email" 
              name="email" 
              value="operador@techcore.com" 
              required 
            />
          </div>
        </div>

        <div class="form-group">
          <div class="label-wrapper">
            <label for="password">Contraseña</label>
            <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="input-container">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              value="••••••••••••••••" 
              required 
            />
            <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          INGRESAR AL PANEL
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p class="system-info">SISTEMA DE CONTROL DE CREDENCIALES UNIFICADO TECHCORE</p>
    <div class="brand-partners">
      <span>NVIDIA RTX</span>
      <span>AMD RYZEN</span>
      <span>INTEL CORE PRO</span>
      <span>ASUS CONTROL</span>
    </div>
  </footer>

</body>
</html>
