<section class="carousel" data-carousel aria-roledescription="carousel" aria-label="Featured computers">
  <header class="carousel__header">
    <div>
      <span class="carousel__tag" data-slot="tag"></span>
      <h2 class="carousel__title" data-slot="title"></h2>
    </div>

    <div class="carousel__actions">
      <div class="carousel__controls" data-slot="controls">
        <button class="carousel__btn" type="button" data-dir="-1" aria-label="Previous computers">&larr;</button>
        <button class="carousel__btn" type="button" data-dir="1" aria-label="Next computers">&rarr;</button>
      </div>
    </div>
  </header>

  <ul class="carousel__track" data-slot="track" tabindex="0"></ul>
</section>
