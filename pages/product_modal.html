<div class="modal-overlay" id="product-modal">
  <div class="modal-card">
    <div class="modal-header">
      <h2>CREATE PRODUCT</h2>
    </div>

    <form id="create-product-form" class="modal-body">
      <div class="form-group">
        <label for="product-name">PRODUCT NAME</label>
        <input
          type="text"
          id="product-name"
          name="name"
          placeholder="PC gamer 16GB RAM ETC"
          required
        />
      </div>

      <div class="form-group">
        <label for="product-description">Description</label>
        <textarea
          id="product-description"
          name="description"
          rows="3"
          placeholder="Write the main product features, specifications, materials..."
        ></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="product-category">Category</label>
          <input
            type="text"
            id="product-category"
            name="category"
            list="categories-list"
            placeholder="Select or type category"
          />

          <datalist id="categories-list">
          </datalist>
        </div>

        <div class="form-group">
          <label for="product-price">Price</label>
          <div class="input-prefix-group">
            <span class="prefix">$</span>
            <input
              type="number"
              id="product-price"
              name="price"
              step="0.01"
              placeholder="0.00"
              required
            />
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="product-stock">Stock Quantity</label>
          <div class="input-prefix-group">
            <span class="prefix">Uds</span>
            <input
              type="number"
              id="product-stock"
              name="stock"
              placeholder="0"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="product-image">Image</label>
          <div class="input-prefix-group">
            <span class="prefix">URL</span>
            <input type="url" id="product-image" name="image" placeholder="" />
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="cancel-btn">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary">Create Product</button>
      </div>
    </form>
  </div>
</div>
