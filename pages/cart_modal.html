<!--
  Cart modal (index.html). Injected into #cart-container by loader.js.
  JS (ui/cart_modal.js) toggles #cart-empty / #cart-lines / #cart-summary according to cart.count
  and clones #tpl-cart-line once per line, filling the [data-field] nodes with textContent.
  Buttons only carry data-action; the line is found with closest('[data-computer-id]').
-->
<div class="modal-overlay" id="cart-modal" hidden>
  <div
    class="modal-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="cart-title"
  >
    <div class="modal-header">
      <h2 id="cart-title">Your cart</h2>
      <button type="button" class="modal-close" data-action="close" aria-label="Close" data-autofocus>&times;</button>
    </div>

    <div class="modal-body">
      <p class="cart-empty" id="cart-empty">Your cart is empty.</p>

      <ul class="cart-lines" id="cart-lines" hidden></ul>

      <div class="cart-summary" id="cart-summary" hidden>
        <p>Total: <strong id="cart-total">$0</strong></p>

        <!-- shows the Error thrown by the models; the modal stays open -->
        <p class="form-error" id="cart-error" role="alert" hidden></p>

        <div class="modal-footer">
          <button type="button" class="boton btn btn-secondary" id="cart-clear" data-action="cart-clear">
            Clear cart
          </button>
          <!-- delete this button if it is decided that there is no checkout -->
          <button type="button" class="boton btn btn-primary" id="cart-checkout" data-action="checkout">
            Checkout
          </button>
        </div>
      </div>
    </div>
  </div>

  <template id="tpl-cart-line">
    <li class="cart-line" data-computer-id="">
      <img data-field="image" alt="" width="64" height="64" />
      <div class="cart-line__info">
        <strong data-field="name"></strong>
        <span data-field="price"></span>
      </div>
      <div class="quantity">
        <button type="button" data-action="cart-decrease" aria-label="Decrease quantity">&minus;</button>
        <input
          type="number"
          class="quantity-input"
          data-field="quantity"
          min="1"
          step="1"
          inputmode="numeric"
          aria-label="Quantity"
        />
        <button type="button" data-action="cart-increase" aria-label="Increase quantity">+</button>
      </div>
      <strong class="cart-line__subtotal" data-field="subtotal"></strong>
      <button type="button" class="cart-line__remove" data-action="cart-remove" aria-label="Remove from cart">&times;</button>
    </li>
  </template>
</div>
